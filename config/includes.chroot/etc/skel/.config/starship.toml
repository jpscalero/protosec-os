# =============================================================================
# ProtoSec OS 1.0 — Configuración de Starship Prompt
# Tema personalizado con colores ProtoSec
# Verde (#00FF41), Negro (#0D0D0D), Naranja (#FF6B35), Azul noche (#1A1A2E)
# =============================================================================

# Formato general del prompt
format = """
$time$username$hostname$directory$git_branch$git_status$python$sudo$cmd_duration$status
$character"""

# Añadir una línea en blanco entre prompts
add_newline = true

# =============================================================================
# CARÁCTER DEL PROMPT
# =============================================================================
[character]
# Símbolo según el resultado del último comando
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[V](bold green)"

# =============================================================================
# USUARIO
# =============================================================================
[username]
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"
show_always = true
disabled = false

# =============================================================================
# HOSTNAME
# =============================================================================
[hostname]
ssh_only = false
format = "@[$hostname](bold green) "
disabled = false

# =============================================================================
# DIRECTORIO
# =============================================================================
[directory]
style = "bold cyan"
truncation_length = 5
truncation_symbol = "…/"
read_only = " 🔒"
read_only_style = "red"
format = "en [$path]($style)[$read_only]($read_only_style) "

# =============================================================================
# GIT — RAMA
# =============================================================================
[git_branch]
format = "en [$symbol$branch]($style) "
symbol = " "
style = "bold purple"
truncation_length = 30
truncation_symbol = "…"

# =============================================================================
# GIT — ESTADO
# =============================================================================
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold orange"
conflicted = "⚔️ "
ahead = "⬆️ ×${count} "
behind = "⬇️ ×${count} "
diverged = "🔀 ⬆️ ×${ahead_count} ⬇️ ×${behind_count} "
untracked = "🆕×${count} "
stashed = "📦 "
modified = "📝×${count} "
staged = "✅×${count} "
renamed = "🔄 "
deleted = "🗑️ ×${count} "

# =============================================================================
# PYTHON — ENTORNO VIRTUAL
# =============================================================================
[python]
format = '[$virtualenv]($style) '
style = "bold yellow"
detect_extensions = ["py"]
detect_files = ["requirements.txt", "setup.py", "pyproject.toml", "Pipfile", ".python-version"]

# =============================================================================
# HORA
# =============================================================================
[time]
disabled = false
format = "[$time]($style) "
style = "bold yellow"
time_format = "%H:%M:%S"
utc_time_offset = "local"

# =============================================================================
# DURACIÓN DEL COMANDO
# =============================================================================
[cmd_duration]
min_time = 2000
format = "tardó [$duration]($style) "
style = "bold yellow"
show_milliseconds = false
show_notifications = false

# =============================================================================
# ESTADO DEL COMANDO
# =============================================================================
[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "❌ "
style = "bold red"

# =============================================================================
# SUDO
# =============================================================================
[sudo]
disabled = false
format = "[$symbol]($style)"
symbol = "🔑 "
style = "bold red"

# =============================================================================
# MÓDULOS ADICIONALES — Lenguajes detectados
# =============================================================================

[rust]
format = "[$symbol($version)]($style) "
symbol = "🦀 "
style = "bold red"

[golang]
format = "[$symbol($version)]($style) "
symbol = "🐹 "
style = "bold cyan"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = "⬢ "
style = "bold green"

[docker_context]
format = "[$symbol$context]($style) "
symbol = "🐳 "
style = "bold blue"

[package]
format = "[$symbol$version]($style) "
symbol = "📦 "
style = "bold 208"
