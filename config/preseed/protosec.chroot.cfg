# ============================================================================
# ProtoSec OS 1.0 — Configuración preseed para el sistema live
# Este archivo preconfigurar las respuestas de debconf para evitar
# diálogos interactivos durante la construcción del sistema.
# ============================================================================

# --- Configuración de locales ---
# Genera el locale español de España con codificación UTF-8
locales locales/locales_to_be_generated multiselect es_ES.UTF-8 UTF-8
locales locales/default_environment_locale select es_ES.UTF-8

# --- Configuración de teclado ---
# Establece la distribución de teclado española
keyboard-configuration keyboard-configuration/xkb-keymap select es
keyboard-configuration keyboard-configuration/layoutcode string es
keyboard-configuration keyboard-configuration/variant select Spanish

# --- Configuración de zona horaria ---
# Zona horaria: Europe/Madrid (CET/CEST)
tzdata tzdata/Areas select Europe
tzdata tzdata/Zones/Europe select Madrid

# --- Configuración de console-setup ---
# Codificación de caracteres UTF-8 para la consola
console-setup console-setup/charmap47 select UTF-8

# --- Wireshark ---
# Permitir captura de paquetes sin privilegios de root
wireshark-common wireshark-common/install-setuid boolean true

# --- SDDM como gestor de pantalla ---
# Establecer SDDM como el display manager predeterminado
sddm shared/default-x-display-manager select sddm

# --- MariaDB ---
# Sin contraseña root inicial (se configura en post-instalación)
mariadb-server-10.11 mysql-server/root_password password
mariadb-server-10.11 mysql-server/root_password_again password

# --- Postfix ---
# Sin configuración de correo (evitar diálogo interactivo)
postfix postfix/main_mailer_type select No configuration
